# documentaiton: https://man.archlinux.org/man/fuzzel.ini.5.en

[main]
font=FiraCode Nerd Font:size=12
dpi-aware=auto
prompt="❯ "
icon-theme=Adwaita
fields=name,generic,comment,categories,filename
show-actions=yes
terminal=foot
lines=10
width=75
horizontal-pad=15
vertical-pad=15
inner-pad=5
image-size-ratio=0.5

layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=282828ff
text=ebdbb2ff
match=fe8019ff
selection=3c3836ff
selection-text=fdbb28ff
selection-match=fe8019ff
border=a89984ff


[border]
width=2
radius=8

[dmenu]
mode=text
exit-immediately-if-empty=no
